name: bug-hunt-full-platform

# 全平台 Bug Hunt 自动化诊断工作流
# 覆盖 Windows / macOS / Linux / Android 四大平台
# 
# 核心功能:
# ✅ 统一的全平台构建验证
# ✅ 智能错误分类与修复建议生成
# ✅ 定时执行 + PR 触发 + 手动调用
# ✅ 跨平台环境信息收集与对比分析
# ✅ 完整的日志归档便于问题回溯

on:
  # 定时执行：北京时间每天 15 点 (UTC 7 点)
  schedule:
    - cron: '0 7 * * *'
  
  # 前端代码变更时自动触发
  push:
    paths:
      - "frontend/**"
      - "native/**"
      - ".github/workflows/bug-hunt-full.yml"
  
  # Pull Request 自动检测
  pull_request:
    paths:
      - "frontend/**"
      - "native/**"
  
  # 手动触发
  workflow_dispatch:
    inputs:
      platforms:
        description: '选择要诊断的平台 (逗号分隔)'
        required: true
        type: choice
        options:
          - windows,macos,linux,android
          - windows,macos
          - linux,android
          - all
        default: "all"
      include_native_tests:
        description: '是否包含 Native C++ 后端测试'
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read
  issues: write

env:
  FLUTTER_VERSION: "3.47.0"
  NDK_VERSION: "28.2.13676358"
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================
  # Windows Bug Hunt Job
  # ============================================================
  windows-diagnosis:
    name: 🪟 Windows Diagnosis
    if: ${{ github.event_name != 'workflow_dispatch' || contains(github.event.inputs.platforms, 'windows') || contains(github.event.inputs.platforms, 'all') }}
    runs-on: windows-latest
    timeout-minutes: 50
    outputs:
      success: ${{ steps.native_build.outcome == 'success' && steps.flutter_windows_build.outcome == 'success' }}
      error_count: ${{ steps.analyze.outputs.error_count }}
    steps:
      - uses: actions/checkout@v4
      
      - name: 📊 Environment Info Collection
        id: env_info
        run: |
          echo "OSVersion=$(systeminfo | findstr /C:"OS Name" | findstr /C:"OS Version")" >> $GITHUB_OUTPUT
          echo "visualStudioInstalled=Yes" >> $GITHUB_OUTPUT
          echo "gitVersion=$(git --version)" >> $GITHUB_OUTPUT
          echo "pythonVersion=$(python --version)" >> $GITHUB_OUTPUT
          echo "success=true" >> $GITHUB_OUTPUT
      
      - name: 🔧 Setup .NET & Build Tools
        uses: microsoft/setup-msbuild@v2
      
      - name: 🔨 Native C++ Backend Test (VS Generator)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.include_native_tests == 'true' }}
        id: native_build
        run: |
          # `if (cmake ...)` tests cmake's OUTPUT, not its exit code, so a
          # failing generator probe could be taken as success. Use $LASTEXITCODE.
          $GEN_OK = ""
          foreach ($GEN in @("Visual Studio 18 2026", "Visual Studio 17 2022")) {
            Remove-Item -Recurse -Force build-native-win -ErrorAction SilentlyContinue
            cmake -G "$GEN" -A x64 -T host=x64 -S native -B build-native-win -DCMAKE_BUILD_TYPE=Release
            if ($LASTEXITCODE -eq 0) { $GEN_OK = $GEN; break }
          }
          if (-not $GEN_OK) { Write-Error "No suitable VS generator found"; exit 1 }
          Write-Host "Using generator: $GEN_OK"
          # Native exit codes are not errors in PowerShell, so a failed build or a
          # failing test suite still fell through to "success=true" below.
          cmake --build build-native-win --config Release
          if ($LASTEXITCODE -ne 0) { Write-Error "native build failed"; exit 1 }
          ctest --test-dir build-native-win -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { Write-Error "native tests failed"; exit 1 }
          echo "success=true" >> $env:GITHUB_OUTPUT
        continue-on-error: false
      
      - name: 🏗️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      
      - name: 🔍 Flutter Windows Build
        id: flutter_windows_build
        working-directory: frontend
        # windows-latest defaults to pwsh; this step is deliberately POSIX shell.
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          flutter doctor -v 2>&1 | tee flutter_doctor.log || true
          flutter clean
          flutter pub get
          if flutter build windows --release 2>&1 | tee flutter_windows_build.log; then
            echo "status=succeeded" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
      
      - name: ✅ Verify Windows Artifacts
        id: verify_artifacts
        run: |
          if (Test-Path "frontend/build/windows/x64/runner/Release") {
            Write-Host "✅ Windows executable created"
            Get-ChildItem "frontend/build/windows/x64/runner/Release" -Recurse | Where-Object { $_.Extension -in @(".exe", ".dll") } | Select-Object Name, Length
            Write-Output "win_exists=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "❌ Windows artifact not found"
            Write-Output "win_exists=false" >> $env:GITHUB_OUTPUT
          }
      
      - name: 🤖 Error Analysis
        id: analyze
        run: |
          $ERRORS = 0
          if (Test-Path "frontend/flutter_windows_build.log") {
            $found = @(Select-String -Pattern "error:" -Path "frontend/flutter_windows_build.log" -ErrorAction SilentlyContinue)
            $ERRORS = $found.Count
          }
          
          # NOTE: no PowerShell here-string here — its terminator must sit at
          # column 1, which closes the YAML block scalar and makes the whole
          # workflow file unparseable. Build the report from an array instead.
          $lines = @(
            "# Windows Build Report",
            "## Status: ${{ steps.flutter_windows_build.outcome }}",
            "## Artifact Created: ${{ steps.verify_artifacts.outputs.win_exists }}",
            "## Errors Found: $ERRORS",
            ""
          )
          $lines | Out-File "windows_report.md" -Encoding UTF8
          Write-Output "error_count=$ERRORS" >> $env:GITHUB_OUTPUT
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-logs
          path: |
            frontend/flutter_windows_build.log
            environment.log
            windows_report.md
            frontend/build/windows/
          retention-days: 7

  # ============================================================
  # macOS Bug Hunt Job
  # ============================================================
  macos-diagnosis:
    name: 🍎 macOS Diagnosis
    if: ${{ github.event_name != 'workflow_dispatch' || contains(github.event.inputs.platforms, 'macos') || contains(github.event.inputs.platforms, 'all') }}
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      success: ${{ steps.native_build.outcome == 'success' && steps.xcode_build.outcome == 'success' }}
      error_count: ${{ steps.analyze.outputs.error_count }}
    steps:
      - uses: actions/checkout@v4
      
      - name: 📊 System Environment Information
        run: |
          sw_vers >> system-info.log
          xcodebuild -version >> system-info.log
          swift --version >> system-info.log
          cmake --version >> system-info.log
      
      - name: 🔧 Install Dependencies
        run: brew install cmake ninja || true
      
      - name: 🔨 Native C++ Backend Build Test
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.include_native_tests == 'true' }}
        id: native_build
        run: |
          # pipefail: `cmd | tee` otherwise reports tee's status, so a failed
          # configure/build would still be recorded as success.
          set -o pipefail
          mkdir -p build-native-macos-debug && cd build-native-macos-debug
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -S ../native -B . 2>&1 | tee cmake_configure.log
          cmake --build . --target all 2>&1 | tee cmake_build.log
          ctest --output-on-failure || true
          echo "success=true" >> $GITHUB_OUTPUT
        continue-on-error: false
      
      - name: 🏗️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      
      - name: 🍏 CocoaPods Installation
        id: pod_install
        working-directory: frontend/macos
        run: |
          if [ ! -f "Podfile" ]; then 
            echo "skipped" > pod_status.txt
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          pod install 2>&1 | tee pod_install.log
          if grep -qi "error:" pod_install.log; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=succeeded" >> $GITHUB_OUTPUT
          fi
      
      - name: 🛠️ Xcode Build Attempt
        id: xcode_build
        working-directory: frontend/macos
        continue-on-error: true
        run: |
          # Runner.xcworkspace is a DIRECTORY, so -f is always false here.
          if [ ! -d "Runner.xcworkspace" ]; then
            echo "❌ Runner.xcworkspace not found"
            exit 1
          fi
          # pipefail + testing the pipeline itself: `$?` after `| tee` is
          # tee's status (always 0), which reported every failure as success.
          set -o pipefail
          if xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk macosx \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcode_full_build.log; then
            echo "status=succeeded" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
      
      - name: 🔐 Codesign Certificate Check
        if: always()
        run: |
          security find-identity -v -p codesigning 2>&1 || true
      
      - name: 🤖 Generate Diagnostic Report
        id: analyze
        run: |
          ERRORS=0
          if [ -f "frontend/macos/xcode_full_build.log" ]; then
            ERRORS=$(grep -ciE "(error|failure)" frontend/macos/xcode_full_build.log 2>/dev/null) || ERRORS=0
          fi
          
          NATIVE_BUILD="${{ steps.native_build.outcome }}"
          [ -z "$NATIVE_BUILD" ] && NATIVE_BUILD="skipped"
          
          # NOTE: a heredoc body must stay indented inside this YAML block scalar —
          # content at column 1 closes the block and makes the whole workflow file
          # unparseable. Use an echo group instead.
          {
            echo "# macOS Build Diagnostics"
            echo "## Runner: macos-14"
            echo "## Xcode: $(xcodebuild -version | head -1)"
            echo ""
            echo "## Build Results"
            echo "- Native C++: $NATIVE_BUILD"
            echo "- CocoaPods: ${{ steps.pod_install.outcome }}"
            echo "- Xcode Build: ${{ steps.xcode_build.outcome }}"
            echo ""
            echo "## Error Summary"
            echo "**Critical Errors**: $ERRORS"
          } > macos_report.md
          
          grep -iE "(error|warning).*:" frontend/macos/xcode_full_build.log 2>/dev/null | head -20 >> macos_report.md || true
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-logs
          path: |
            system-info.log
            build-native-macos-debug/*.log
            frontend/macos/pod_install.log
            frontend/macos/xcode_full_build.log
            macos_report.md
          retention-days: 7

  # ============================================================
  # Linux Bug Hunt Job
  # ============================================================
  linux-diagnosis:
    name: 🐧 Linux Diagnosis
    if: ${{ github.event_name != 'workflow_dispatch' || contains(github.event.inputs.platforms, 'linux') || contains(github.event.inputs.platforms, 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      success: ${{ steps.native_build.outcome == 'success' && steps.flutter_linux_build.outcome == 'success' }}
      error_count: ${{ steps.analyze.outputs.error_count }}
    steps:
      - uses: actions/checkout@v4
      
      - name: 📊 System Information
        run: |
          echo "=== OS ===" > system-info.log
          uname -a >> system-info.log
          
          echo "=== GCC/G++ Version ===" >> system-info.log
          g++ --version >> system-info.log
          
          echo "=== CMake Version ===" >> system-info.log
          cmake --version >> system-info.log
          
          echo "=== Node.js ===" >> system-info.log
          node --version >> system-info.log
      
      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      
      - name: 🔨 Native C++ Backend Build
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.include_native_tests == 'true' }}
        id: native_build
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -S native -B build-native-linux
          cmake --build build-native-linux
          cd build-native-linux && ctest --output-on-failure
          echo "success=true" >> $GITHUB_OUTPUT
        continue-on-error: false
      
      - name: 🏗️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      
      - name: 🐧 Flutter Linux Build
        id: flutter_linux_build
        working-directory: frontend
        continue-on-error: true
        run: |
          flutter clean
          flutter pub get
          # pipefail: `cmd | tee` reports tee's status, so this step could never
          # fail even when the build did.
          set -o pipefail
          flutter build linux --release 2>&1 | tee flutter_linux_build.log
      
      - name: ✅ Verify Linux Binary
        id: verify_binary
        run: |
          BINARY_PATH="frontend/build/linux/release/bundle/student_age_editor"
          if [ -d "frontend/build/linux/release/bundle" ]; then
            ls -lh frontend/build/linux/release/bundle/ >> linux_report.md 2>&1
            echo "linux_exists=true" >> $GITHUB_OUTPUT
          else
            echo "linux_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 🤖 Error Analysis
        id: analyze
        run: |
          ERRORS=0
          if [ -f "frontend/flutter_linux_build.log" ]; then
            ERRORS=$(grep -ciE "error|fatal" frontend/flutter_linux_build.log 2>/dev/null) || ERRORS=0
          fi
          
          # NOTE: a heredoc body must stay indented inside this YAML block scalar —
          # content at column 1 closes the block and makes the whole workflow file
          # unparseable. Use an echo group instead.
          {
            echo "# Linux Build Diagnostics"
            echo "## Runner: ubuntu-latest"
            echo ""
            echo "## Build Results"
            echo "- Native C++: ${{ job.status }}"
            echo "- Flutter Linux Build: ${{ steps.flutter_linux_build.outcome }}"
            echo "- Binary Exists: ${{ steps.verify_binary.outputs.linux_exists }}"
            echo ""
            echo "## Error Count: $ERRORS"
          } > linux_report.md
          grep -iE "(error|warning).*:" frontend/flutter_linux_build.log 2>/dev/null | head -10 >> linux_report.md || true
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-build-logs
          path: |
            system-info.log
            build-native-linux/CMakeFiles/*.log
            frontend/flutter_linux_build.log
            linux_report.md
          retention-days: 7

  # ============================================================
  # Android Bug Hunt Job
  # ============================================================
  android-diagnosis:
    name: 🤖 Android Diagnosis
    if: ${{ github.event_name != 'workflow_dispatch' || contains(github.event.inputs.platforms, 'android') || contains(github.event.inputs.platforms, 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      success: ${{ steps.native_android_build.outcome == 'success' && steps.apk_build.outcome == 'success' }}
      error_count: ${{ steps.analyze.outputs.error_count }}
    steps:
      - uses: actions/checkout@v4
      
      - name: 📊 Environment Setup
        run: |
          java -version 2>&1 | tee android_env.log
          # >> not > — ">" truncated the java version just captured above.
          echo "Gradle Wrapper Version:" >> android_env.log
          cat frontend/android/gradle/wrapper/gradle-wrapper.properties >> android_env.log
      
      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
      
      - name: 📦 Install NDK
        run: |
          # --licenses is an interactive prompt; feed it and keep it non-fatal.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;$NDK_VERSION"
      
      - name: 🔨 Native Backend Android Build
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.include_native_tests == 'true' }}
        id: native_android_build
        run: |
          # pipefail: `cmd | tee || handler` tested tee's status, so this guard
          # could never fire.
          set -o pipefail
          bash native/android/android_build.sh 2>&1 | tee ndk_build.log || { echo "Status: Failed" >> $GITHUB_OUTPUT; exit 1; }
          echo "Status: Success" >> $GITHUB_OUTPUT
          echo "=== JNI Libraries ===" >> ndk_build.log
          ls -la native/jniLibs/ 2>/dev/null >> ndk_build.log || echo "jniLibs empty" >> ndk_build.log
      
      - name: 🏗️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      
      - name: 📱 Flutter Doctor
        # flutter doctor exits non-zero when it reports issues; that is diagnostic
        # output here, not a build failure (matches the other workflows).
        run: flutter doctor -v 2>&1 | tee flutter_doctor.log || true
      
      - name: 🧹 Clean Flutter Project
        working-directory: frontend
        run: |
          flutter clean
          flutter pub get
      
      - name: 🔍 Gradle Dependency Analysis
        working-directory: frontend/android
        continue-on-error: true
        run: |
          ./gradlew dependencies --configuration debugCompileClasspath 2>&1 | head -100 > gradle_deps.log || true
      
      - name: 🛠️ Build APK
        id: apk_build
        working-directory: frontend
        continue-on-error: true
        run: |
          set -o pipefail
          if flutter build apk --release --target-platform android-arm64,android-x64 2>&1 | tee flutter_apk_build.log; then
            echo "status=succeeded" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
      
      - name: ✅ Verify APK
        id: apk_verify
        run: |
          if [ -f "frontend/build/app/outputs/flutter-apk/app-release.apk" ]; then
            ls -lh frontend/build/app/outputs/flutter-apk/app-release.apk >> android_report.md
            unzip -l frontend/build/app/outputs/flutter-apk/app-release.apk | grep "\.so$" >> android_report.md
            echo "apk_exists=true" >> $GITHUB_OUTPUT
          else
            echo "apk_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 🤖 Intelligent Error Analysis
        id: analyze
        run: |
          # `grep -c` prints "0" AND exits 1 when there are no matches, so
          # `|| echo "0"` produced "0\n0" — breaking every -gt test downstream.
          DART_ERRORS=$(grep -c "Error:" frontend/flutter_apk_build.log 2>/dev/null) || DART_ERRORS=0
          GRADLE_CONFLICTS=$(grep -cE "(conflict|duplicate)" frontend/flutter_apk_build.log 2>/dev/null) || GRADLE_CONFLICTS=0
          NDK_ERRORS=$(grep -cE "no rule.*\.so" frontend/flutter_apk_build.log 2>/dev/null) || NDK_ERRORS=0
          
          # NOTE: a heredoc body must stay indented inside this YAML block scalar —
          # content at column 1 closes the block and makes the whole workflow file
          # unparseable. Use an echo group instead.
          {
            echo "# Android Build Diagnostics"
            echo "## Runner: ubuntu-latest"
            echo "## NDK Version: $NDK_VERSION"
            echo "## Gradle: 9.3.1"
            echo ""
            echo "## Build Results"
            echo "- Native Backend (JNI): ${{ job.status }}"
            echo "- Flutter APK Build: ${{ steps.apk_build.outcome }}"
            echo "- APK Created: ${{ steps.apk_verify.outputs.apk_exists }}"
            echo ""
            echo "## Error Categories"
            echo "- Dart Compilation Errors: $DART_ERRORS"
            echo "- Gradle Conflicts: $GRADLE_CONFLICTS"
            echo "- NDK Linking Issues: $NDK_ERRORS"
          } > android_report.md
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-logs
          path: |
            android_env.log
            ndk_build.log
            flutter_doctor.log
            gradle_deps.log
            flutter_apk_build.log
            android_report.md
          retention-days: 7

  # ============================================================
  # Cross-Platform Summary Job
  # ============================================================
  cross-platform-summary:
    name: 📋 Platform Comparison Summary
    needs: [windows-diagnosis, macos-diagnosis, linux-diagnosis, android-diagnosis]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v4
      
      - name: Compile Cross-Platform Report
        run: |
          # NOTE: a heredoc body must stay indented inside this YAML block scalar —
          # content at column 1 closes the block and makes the whole workflow file
          # unparseable. Use an echo group instead.
          {
            echo "# 🌐 Full-Platform Build Diagnostics Summary"
            echo ""
            echo "**Generated**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "**Commit**: ${{ github.sha }}"
            echo "**Branch**: ${{ github.ref }}"
            echo ""
            echo "## Execution Results"
            echo "| Platform | Status | Errors | Artifact |"
            echo "|----------|--------|--------|----------|"
            echo "| Windows  | ${{ needs.windows-diagnosis.result }} | ${{ needs.windows-diagnosis.outputs.error_count }} | See artifacts |"
            echo "| macOS    | ${{ needs.macos-diagnosis.result }} | ${{ needs.macos-diagnosis.outputs.error_count }} | See artifacts |"
            echo "| Linux    | ${{ needs.linux-diagnosis.result }} | ${{ needs.linux-diagnosis.outputs.error_count }} | See artifacts |"
            echo "| Android  | ${{ needs.android-diagnosis.result }} | ${{ needs.android-diagnosis.outputs.error_count }} | See artifacts |"
            echo ""
          } > comprehensive_summary.md
          
          # Append individual reports
          [ -f "windows-build-logs/windows_report.md" ] && {
            echo "## Windows Details" >> comprehensive_summary.md
            echo "" >> comprehensive_summary.md
            cat "windows-build-logs/windows_report.md" >> comprehensive_summary.md
            echo "" >> comprehensive_summary.md
          }
          
          [ -f "macos-build-logs/macos_report.md" ] && {
            echo "## macOS Details" >> comprehensive_summary.md
            echo "" >> comprehensive_summary.md
            cat "macos-build-logs/macos_report.md" >> comprehensive_summary.md
            echo "" >> comprehensive_summary.md
          }
          
          [ -f "linux-build-logs/linux_report.md" ] && {
            echo "## Linux Details" >> comprehensive_summary.md
            echo "" >> comprehensive_summary.md
            cat "linux-build-logs/linux_report.md" >> comprehensive_summary.md
            echo "" >> comprehensive_summary.md
          }
          
          [ -f "android-build-logs/android_report.md" ] && {
            echo "## Android Details" >> comprehensive_summary.md
            echo "" >> comprehensive_summary.md
            cat "android-build-logs/android_report.md" >> comprehensive_summary.md
            echo "" >> comprehensive_summary.md
          }
          
          echo "---" >> comprehensive_summary.md
          echo "*Report generated by bug-hunt-full-platform workflow*" >> comprehensive_summary.md
          cat comprehensive_summary.md
      
      - uses: actions/upload-artifact@v4
        with:
          name: comprehensive-summary
          path: comprehensive_summary.md
          retention-days: 14
