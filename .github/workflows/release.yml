name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 发行版本号（如 1.3.0）
        required: true
        default: "1.3.0"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"
  PYTHON_VERSION: "3.12"
  # Windows runner 的管道 stdout 默认区域编码，中文打印会 UnicodeEncodeError
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 打包依赖
        run: python -m pip install pyinstaller unitypy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 安装 Inno Setup 6 (Windows 安装包编译器)
        shell: bash
        run: |
          if ! command -v ISCC &> /dev/null && [ ! -f "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && [ ! -f "C:/Program Files/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y
          fi
          echo "C:\Program Files (x86)\Inno Setup 6" >> "$GITHUB_PATH"
          echo "C:\Program Files\Inno Setup 6" >> "$GITHUB_PATH"
      - name: 解析版本号
        shell: bash
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 还原官方资源包缓存（ci-assets Release）
        shell: bash
        run: |
          python packaging/fetch_bundled.py --asset official_pack_cache.zip --tag ci-assets \
            --out build/cache/official_pack_cache.zip
          if [ ! -f build/cache/official_pack_cache.zip ]; then
            echo "错误：ci-assets Release 缺少 official_pack_cache.zip，无法构建安装包"
            exit 1
          fi
          python -c "import zipfile; zipfile.ZipFile('build/cache/official_pack_cache.zip').extractall('backend/_cache')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 Windows 发行版与安装包
        shell: bash
        run: python build_release.py --target windows --version $RELEASE_VERSION
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup-*.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build \
            pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 打包依赖
        run: python -m pip install pyinstaller unitypy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 解析版本号
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 下载 appimagetool（AppImage 打包工具）
        run: |
          mkdir -p build/tools
          curl -fL -o build/tools/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/tools/appimagetool-x86_64.AppImage
      - name: 还原官方资源包缓存（ci-assets Release）
        run: |
          python packaging/fetch_bundled.py --asset official_pack_cache.zip --tag ci-assets \
            --out build/cache/official_pack_cache.zip
          if [ ! -f build/cache/official_pack_cache.zip ]; then
            echo "错误：ci-assets Release 缺少 official_pack_cache.zip，无法构建安装包"
            exit 1
          fi
          python -c "import zipfile; zipfile.ZipFile('build/cache/official_pack_cache.zip').extractall('backend/_cache')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 Linux 发行版与安装包（deb + AppImage）
        run: python build_release.py --target linux --version $RELEASE_VERSION
      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.AppImage

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 打包依赖
        run: python3 -m pip install pyinstaller unitypy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 解析版本号
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 还原官方资源包缓存（ci-assets Release）
        run: |
          python3 packaging/fetch_bundled.py --asset official_pack_cache.zip --tag ci-assets \
            --out build/cache/official_pack_cache.zip
          if [ ! -f build/cache/official_pack_cache.zip ]; then
            echo "错误：ci-assets Release 缺少 official_pack_cache.zip，无法构建安装包"
            exit 1
          fi
          python3 -c "import zipfile; zipfile.ZipFile('build/cache/official_pack_cache.zip').extractall('backend/_cache')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 macOS 发行版与安装包（DMG + PKG）
        run: python3 build_release.py --target macos --version $RELEASE_VERSION
      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.pkg

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 打包依赖
        run: python -m pip install unitypy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 解析版本号
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 同步 Python 后端到 Android 工程
        run: python packaging/sync_android_python.py
      - name: 注入内置资源包（可选，从 GitHub Release 下载）
        shell: bash
        run: |
          python packaging/fetch_bundled.py \
            --asset bundled_preview.zip \
            --tag ci-assets \
            --out frontend/android/app/src/main/assets/bundled/resource_pack.zip \
          || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 Android APK
        working-directory: frontend
        run: flutter build apk --release --target-platform android-arm64,android-x64
      - name: 整理 APK 命名
        run: |
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk \
             "dist/学生时代模组编辑器-v$RELEASE_VERSION-android.apk"
      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    name: 发布到 GitHub Release
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总产物
        run: find artifacts -type f | sort
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*
            artifacts/linux/*
            artifacts/macos/*
            artifacts/android/*
          draft: true
