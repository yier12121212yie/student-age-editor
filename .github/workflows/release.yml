name: release

on:
  push:
    tags:
      - "v*"
      - "Alpha-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 发行版本号（如 Alpha-v0.1；留空则取 tag 名或 frontend/pubspec.yaml）
        required: false
        default: "Alpha-v0.1"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"
  PYTHON_VERSION: "3.12"
  # Windows runner 的管道 stdout 默认区域编码，中文打印会 UnicodeEncodeError
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 打包依赖
        # Windows 后端已切 native C++：pyinstaller+unitypy 仅供 aa_scan.exe
        # （资源扫描工具冻结）使用；构建失败脚本会降级为不随包，不阻塞。
        run: python -m pip install pyinstaller unitypy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 安装 Inno Setup 6 (Windows 安装包编译器)
        shell: bash
        run: |
          if ! command -v ISCC &> /dev/null && [ ! -f "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && [ ! -f "C:/Program Files/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y
          fi
          echo "C:\Program Files (x86)\Inno Setup 6" >> "$GITHUB_PATH"
          echo "C:\Program Files\Inno Setup 6" >> "$GITHUB_PATH"
      - name: 解析版本号
        shell: bash
        env:
          # 注入修复（安全批次 A）：workflow input 一律经 env 映射后以 "$VAR"
          # 引用，绝不直接内插进 run 脚本，防止 input 内容被当作 shell 源码。
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VER="$VERSION_INPUT"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/Alpha-v* ]]; then VER="$GITHUB_REF_NAME"; fi
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?)(\+[0-9]+)?[[:space:]]*$/\1/p' frontend/pubspec.yaml | head -n1)"
          fi
          if [ -z "$VER" ]; then
            echo "错误：无法解析版本号（workflow_dispatch 输入、tag 名、pubspec.yaml 均未提供）" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 还原官方资源包缓存（ci-assets Release，SHA-256 强校验）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 供应链强校验（安全批次 A）：资产哈希 pin 在 packaging/ci_assets.lock.json，
          # fetch_bundled.py 下载后立即重算比对；哈希不匹配（退出码 3）直接中止发布，
          # 防止 Release asset 被替换后静默进入发行物。网络失败（退出码 1）沿用旧
          # 语义降级为不带内嵌资源继续构建。pin 为 null 时放行并回显实测哈希，
          # 提醒维护者补 pin。
          PIN="$(python -c "import json;print((json.load(open('packaging/ci_assets.lock.json',encoding='utf-8')).get('official_pack_cache.zip') or {}).get('sha256') or '')")"
          ARGS=(--asset official_pack_cache.zip --tag ci-assets --out build/cache/official_pack_cache.zip)
          [ -z "$PIN" ] || ARGS+=(--expect-sha256 "$PIN")
          RC=0
          python packaging/fetch_bundled.py "${ARGS[@]}" || RC=$?
          if [ "$RC" -eq 3 ]; then
            echo "::error::official_pack_cache.zip SHA-256 与 packaging/ci_assets.lock.json 不匹配，中止构建" >&2
            exit 1
          fi
          if [ -f build/cache/official_pack_cache.zip ]; then
            if [ "$RC" -eq 0 ] && [ -z "$PIN" ]; then
              ACTUAL="$(python -c "import hashlib;print(hashlib.sha256(open('build/cache/official_pack_cache.zip','rb').read()).hexdigest())")"
              echo "::warning::official_pack_cache.zip 尚未在 packaging/ci_assets.lock.json pin SHA-256（当前实测 $ACTUAL），请核对资产后补 pin"
            fi
            python -c "import zipfile; zipfile.ZipFile('build/cache/official_pack_cache.zip').extractall('backend/_cache')"
            echo "已加载官方资源包缓存"
          else
            echo "提示：未找到官方资源包缓存（ci-assets 缺少 official_pack_cache.zip），安装包将不包含内嵌资源"
          fi
      - name: 构建 native C++ 后端（CMake，VS 生成器免 vcvars）
        shell: bash
        run: |
          # windows-latest 镜像自带 VS + cmake（2026-09 起为 windows-2025-vs2026，
          # 生成器名随大版本变化）；依次探测 VS 生成器，无需 Ninja/vcvars。
          cmake --version
          GEN_OK=""
          for GEN in "Visual Studio 18 2026" "Visual Studio 17 2022"; do
            rm -rf build-native
            # SA_APP_VERSION：GET /api/version 与更新检查用的发行版本号，与产物命名同源
            if cmake -G "$GEN" -A x64 -T host=x64 -S native -B build-native \
                 -DSA_APP_VERSION="$RELEASE_VERSION"; then
              GEN_OK="$GEN"; break
            fi
          done
          [ -n "$GEN_OK" ] || { echo "错误：未找到可用的 Visual Studio 生成器"; exit 1; }
          echo "使用生成器：$GEN_OK"
          cmake --build build-native --config Release
          mkdir -p build/native_bin
          for f in backend backend_cli backend_tui; do
            exe="$(find build-native -name "$f.exe" -type f | head -1)"
            [ -n "$exe" ] || { echo "错误：native 产物 $f.exe 未找到"; exit 1; }
            cp "$exe" build/native_bin/
          done
          ls -l build/native_bin
      - name: 构建 Windows 发行版与安装包
        shell: bash
        run: python build_release.py --target windows --version $RELEASE_VERSION --prebuilt-backend build/native_bin
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup-*.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build \
            pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 打包依赖
        # Linux 后端已是 native C++（W4-5）；pyinstaller/unitypy 仅供 aa_scan
        # 冻结（可选，失败脚本降级为不随包）；旧 CLI/TUI 的运行时依赖
        # （rich/textual/prompt_toolkit）已随 Python 后端退役。
        run: python -m pip install pyinstaller unitypy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 解析版本号
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VER="$VERSION_INPUT"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/Alpha-v* ]]; then VER="$GITHUB_REF_NAME"; fi
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?)(\+[0-9]+)?[[:space:]]*$/\1/p' frontend/pubspec.yaml | head -n1)"
          fi
          if [ -z "$VER" ]; then
            echo "错误：无法解析版本号（workflow_dispatch 输入、tag 名、pubspec.yaml 均未提供）" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 下载 appimagetool（AppImage 打包工具）
        run: |
          mkdir -p build/tools
          curl -fL -o build/tools/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/tools/appimagetool-x86_64.AppImage
      - name: 还原官方资源包缓存（ci-assets Release，SHA-256 强校验）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 与 Windows job 同款供应链强校验：哈希 pin 在 packaging/ci_assets.lock.json，
          # 哈希不匹配（退出码 3）中止；网络失败（退出码 1）降级为不带内嵌资源继续。
          PIN="$(python -c "import json;print((json.load(open('packaging/ci_assets.lock.json',encoding='utf-8')).get('official_pack_cache.zip') or {}).get('sha256') or '')")"
          ARGS=(--asset official_pack_cache.zip --tag ci-assets --out build/cache/official_pack_cache.zip)
          [ -z "$PIN" ] || ARGS+=(--expect-sha256 "$PIN")
          RC=0
          python packaging/fetch_bundled.py "${ARGS[@]}" || RC=$?
          if [ "$RC" -eq 3 ]; then
            echo "::error::official_pack_cache.zip SHA-256 与 packaging/ci_assets.lock.json 不匹配，中止构建" >&2
            exit 1
          fi
          if [ -f build/cache/official_pack_cache.zip ]; then
            if [ "$RC" -eq 0 ] && [ -z "$PIN" ]; then
              ACTUAL="$(python -c "import hashlib;print(hashlib.sha256(open('build/cache/official_pack_cache.zip','rb').read()).hexdigest())")"
              echo "::warning::official_pack_cache.zip 尚未在 packaging/ci_assets.lock.json pin SHA-256（当前实测 $ACTUAL），请核对资产后补 pin"
            fi
            python -c "import zipfile; zipfile.ZipFile('build/cache/official_pack_cache.zip').extractall('backend/_cache')"
            echo "已加载官方资源包缓存"
          else
            echo "提示：未找到官方资源包缓存（ci-assets 缺少 official_pack_cache.zip），安装包将不包含内嵌资源"
          fi
      - name: 构建 native C++ 后端（CMake + Ninja）
        shell: bash
        run: |
          # 本 job 已装 clang/cmake/ninja-build；与 native/build.sh 同法但显式
          # 构建三件套并收集到 build/native_bin 供 --prebuilt-backend 注入。
          cmake -G Ninja -S native -B build-native-posix -DCMAKE_BUILD_TYPE=Release \
            -DSA_APP_VERSION="$RELEASE_VERSION"
          cmake --build build-native-posix
          mkdir -p build/native_bin
          cp build-native-posix/bin/backend build-native-posix/bin/backend_cli \
             build-native-posix/bin/backend_tui build/native_bin/
          ls -l build/native_bin
      - name: 构建 Linux 发行版与安装包（deb + AppImage）
        run: python build_release.py --target linux --version $RELEASE_VERSION --prebuilt-backend build/native_bin
      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.AppImage

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 打包依赖
        # macOS 后端已是 native C++（W4-5）；pyinstaller/unitypy 仅供 aa_scan
        # 冻结（可选）；旧 CLI/TUI 的 rich/textual/prompt_toolkit 已退役。
        run: python3 -m pip install pyinstaller unitypy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 解析版本号
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VER="$VERSION_INPUT"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/Alpha-v* ]]; then VER="$GITHUB_REF_NAME"; fi
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?)(\+[0-9]+)?[[:space:]]*$/\1/p' frontend/pubspec.yaml | head -n1)"
          fi
          if [ -z "$VER" ]; then
            echo "错误：无法解析版本号（workflow_dispatch 输入、tag 名、pubspec.yaml 均未提供）" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 还原官方资源包缓存（ci-assets Release，SHA-256 强校验）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 与 Windows job 同款供应链强校验（packaging/ci_assets.lock.json pin）。
          PIN="$(python3 -c "import json;print((json.load(open('packaging/ci_assets.lock.json',encoding='utf-8')).get('official_pack_cache.zip') or {}).get('sha256') or '')")"
          ARGS=(--asset official_pack_cache.zip --tag ci-assets --out build/cache/official_pack_cache.zip)
          [ -z "$PIN" ] || ARGS+=(--expect-sha256 "$PIN")
          RC=0
          python3 packaging/fetch_bundled.py "${ARGS[@]}" || RC=$?
          if [ "$RC" -eq 3 ]; then
            echo "::error::official_pack_cache.zip SHA-256 与 packaging/ci_assets.lock.json 不匹配，中止构建" >&2
            exit 1
          fi
          if [ -f build/cache/official_pack_cache.zip ]; then
            if [ "$RC" -eq 0 ] && [ -z "$PIN" ]; then
              ACTUAL="$(python3 -c "import hashlib;print(hashlib.sha256(open('build/cache/official_pack_cache.zip','rb').read()).hexdigest())")"
              echo "::warning::official_pack_cache.zip 尚未在 packaging/ci_assets.lock.json pin SHA-256（当前实测 $ACTUAL），请核对资产后补 pin"
            fi
            python3 -c "import zipfile; zipfile.ZipFile('build/cache/official_pack_cache.zip').extractall('backend/_cache')"
            echo "已加载官方资源包缓存"
          else
            echo "提示：未找到官方资源包缓存（ci-assets 缺少 official_pack_cache.zip），安装包将不包含内嵌资源"
          fi
      - name: 构建 native C++ 后端（CMake + Ninja）
        shell: bash
        run: |
          # macos-14 runner 自带 cmake；ninja 缺失时回落 CMake 默认生成器
          # （build_release.py 的 POSIX 通道同样容忍），三件套收进
          # build/native_bin 供 --prebuilt-backend 注入。
          if ! command -v ninja >/dev/null; then brew install ninja || true; fi
          GEN=""; command -v ninja >/dev/null && GEN="-G Ninja"
          cmake $GEN -S native -B build-native-posix -DCMAKE_BUILD_TYPE=Release \
            -DSA_APP_VERSION="$RELEASE_VERSION"
          cmake --build build-native-posix
          mkdir -p build/native_bin
          cp build-native-posix/bin/backend build-native-posix/bin/backend_cli \
             build-native-posix/bin/backend_tui build/native_bin/
          ls -l build/native_bin
      - name: 构建 macOS 发行版与安装包（DMG + PKG）
        run: python3 build_release.py --target macos --version $RELEASE_VERSION --prebuilt-backend build/native_bin
      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.pkg

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # W4-4: Android 后端已是 native C++（libbackend_shared.so），不再内嵌 CPython。
      # setup-python 仅保留给 fetch_bundled.py（纯标准库 urllib，无需 pip 依赖）。
      - uses: android-actions/setup-android@v4
      - name: 安装 Android NDK（native 后端交叉编译）
        run: sdkmanager "ndk;28.2.13676358"
      - name: 确保 cmake/ninja 可用
        shell: bash
        run: |
          if ! command -v cmake >/dev/null; then sudo apt-get update && sudo apt-get install -y cmake; fi
          if ! command -v ninja >/dev/null; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 解析版本号
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VER="$VERSION_INPUT"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/Alpha-v* ]]; then VER="$GITHUB_REF_NAME"; fi
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?)(\+[0-9]+)?[[:space:]]*$/\1/p' frontend/pubspec.yaml | head -n1)"
          fi
          if [ -z "$VER" ]; then
            echo "错误：无法解析版本号（workflow_dispatch 输入、tag 名、pubspec.yaml 均未提供）" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 交叉编译 native 后端（NDK，产物落 jniLibs/<abi>/）
        shell: bash
        env:
          # Android 的 backend .so 同样要带发行版本号（GET /api/version / 更新检查）
          SA_APP_VERSION: ${{ env.RELEASE_VERSION }}
        run: bash native/android/android_build.sh
      - name: 注入内置资源包（可选，从 GitHub Release 下载，SHA-256 强校验）
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 供应链强校验（安全批次 A）：哈希 pin 在 packaging/ci_assets.lock.json。
          # 哈希不匹配（退出码 3）中止 —— 该 zip 会被解包进 APK assets，绝不能
          # 让被替换的资产进发行物；网络失败（退出码 1）沿用旧语义跳过注入。
          PIN="$(python -c "import json;print((json.load(open('packaging/ci_assets.lock.json',encoding='utf-8')).get('bundled_preview.zip') or {}).get('sha256') or '')")"
          ARGS=(--asset bundled_preview.zip --tag ci-assets
                --out frontend/android/app/src/main/assets/bundled/resource_pack.zip)
          [ -z "$PIN" ] || ARGS+=(--expect-sha256 "$PIN")
          RC=0
          python packaging/fetch_bundled.py "${ARGS[@]}" || RC=$?
          if [ "$RC" -eq 3 ]; then
            echo "::error::bundled_preview.zip SHA-256 与 packaging/ci_assets.lock.json 不匹配，中止构建" >&2
            exit 1
          fi
          if [ "$RC" -eq 0 ] && [ -z "$PIN" ] && [ -f frontend/android/app/src/main/assets/bundled/resource_pack.zip ]; then
            ACTUAL="$(python -c "import hashlib;print(hashlib.sha256(open('frontend/android/app/src/main/assets/bundled/resource_pack.zip','rb').read()).hexdigest())")"
            echo "::warning::bundled_preview.zip 尚未在 packaging/ci_assets.lock.json pin SHA-256（当前实测 $ACTUAL），请核对资产后补 pin"
          fi
      # 供应链护栏：keystore 不入库，release 通道必须由 secrets 注入。
      # 缺失即 fail —— build.gradle.kts 本地可回落 debug 签名（调试方便），
      # 但发到 GitHub Release 的包绝不允许是 debug 签名（任何人可用通用
      # debug key 产出签名一致的"更新"）。
      - name: 部署 release keystore（缺 secrets 则 fail）
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::缺少 ANDROID_RELEASE_KEYSTORE_BASE64 / ANDROID_RELEASE_KEYSTORE_PASSWORD"
            echo "release 通道禁止回落 debug 签名；请在仓库 secrets 配置正式 keystore。" >&2
            exit 1
          fi
          [ -n "$KEY_ALIAS" ] || KEY_ALIAS="studentage"
          mkdir -p frontend/android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > frontend/android/keystore/release.keystore
          # 逐行 printf 而非 heredoc（安全批次 A）：无引号 heredoc 会对内容做
          # 参数展开/命令替换，密码含 $ 或反引号时会被 shell 吃掉甚至执行；
          # printf 的 %s 只做值替换，密码原样落盘。
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
          } > frontend/android/keystore/key.properties
      - name: 构建 Android APK
        working-directory: frontend
        run: flutter build apk --release --target-platform android-arm64,android-x64
      - name: 校验 APK 为正式签名（防 debug/空签名混入 release）
        shell: bash
        run: |
          set -euo pipefail
          APK=frontend/build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          # apksigner verify 非零退出码 = 签名校验失败（签名缺失/损坏/校验器
          # 报错一律 fail，安全批次 A：不再只盯 debug 证书一种形态）。
          if ! "$SIGNER" verify --print-certs "$APK" > /tmp/apk_certs.txt 2>&1; then
            echo "::error::apksigner verify 失败（退出码 $?），APK 签名无效："
            cat /tmp/apk_certs.txt >&2
            exit 1
          fi
          if [ ! -s /tmp/apk_certs.txt ]; then
            echo "::error::apksigner 未报告任何签名证书（空签名），中止发布" >&2
            exit 1
          fi
          if grep -qi "CN=Android Debug" /tmp/apk_certs.txt; then
            echo "::error::release 产物是 debug 签名，中止发布" >&2
            exit 1
          fi
          echo "APK 签名校验通过："
          sed -n '1,5p' /tmp/apk_certs.txt
      - name: 整理 APK 命名
        run: |
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk \
             "dist/student-age-editor-$RELEASE_VERSION-android.apk"
      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  build-web:
    name: Web（网页版）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # web 通道无需 pip 依赖：backend_dist/桌面包完全不参与，脚本仅用标准库
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 解析版本号
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VER="$VERSION_INPUT"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/Alpha-v* ]]; then VER="$GITHUB_REF_NAME"; fi
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?)(\+[0-9]+)?[[:space:]]*$/\1/p' frontend/pubspec.yaml | head -n1)"
          fi
          if [ -z "$VER" ]; then
            echo "错误：无法解析版本号（workflow_dispatch 输入、tag 名、pubspec.yaml 均未提供）" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 构建网页版独立发行物（dist/web-app-<版本>.zip）
        # 走 build_release.py web 通道：flutter build web + 根级
        # README-网页版.txt 组装 + 打包断言（桌面包反污染另有 make_zip 护栏）
        run: python build_release.py --target web --version $RELEASE_VERSION
      - name: 校验 Web 产物就位
        run: ls -l dist/web-app-*.zip
      - name: 上传 Web 产物
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: dist/web-app-*.zip

  build-server-linux:
    name: Server Linux（在线托管）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装服务端构建依赖
        # 与 Linux 桌面 job 保持独立（不装 GTK/桌面依赖），apt 安装互不踩踏
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 解析版本号
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VER="$VERSION_INPUT"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/Alpha-v* ]]; then VER="$GITHUB_REF_NAME"; fi
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?)(\+[0-9]+)?[[:space:]]*$/\1/p' frontend/pubspec.yaml | head -n1)"
          fi
          if [ -z "$VER" ]; then
            echo "错误：无法解析版本号（workflow_dispatch 输入、tag 名、pubspec.yaml 均未提供）" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: configure 并构建 backend/backend_gateway（sa_tests 门禁）
        id: gateway
        run: |
          # 构建目录与 build_release.py server-linux 通道一致（native/build-server），
          # 本步跑测试门禁，脚本复用同一目录增量编译秒级完成。
          # backend_gateway 为 POSIX-only 新二进制（native/gateway 子项目）；
          # 旧树缺该 target 时本次跳过完整打包，不阻塞其余发布通道。
          cmake -G Ninja -S native -B native/build-server -DCMAKE_BUILD_TYPE=Release \
            -DSA_APP_VERSION="$RELEASE_VERSION"
          if grep -rsw --include=CMakeLists.txt --exclude-dir='build*' backend_gateway native; then
            cmake --build native/build-server --target backend backend_gateway sa_tests
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未发现 backend_gateway 目标（native/gateway 未落地），本次跳过 server-linux 完整打包"
            cmake --build native/build-server --target backend sa_tests
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          # 门禁：sa_tests 全量用例（含 [gateway] 标签）必须在打包前全绿
          native/build-server/bin/sa_tests
      - name: 构建在线托管发行物（dist/editor-server-linux-<版本>.zip）
        if: steps.gateway.outputs.enabled == 'true'
        run: python build_release.py --target server-linux --version $RELEASE_VERSION
      - name: 上传 Server Linux 产物
        if: steps.gateway.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: dist/editor-server-linux-*.zip

  release:
    name: 发布到 GitHub Release
    needs: [windows, linux, macos, android, build-web, build-server-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总产物
        run: find artifacts -type f | sort
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "学生时代模组编辑器 ${{ github.ref_name }}"
          files: |
            artifacts/windows/*
            artifacts/linux/*
            artifacts/macos/*
            artifacts/android/*
            # 网页版独立发行物（文件名沿用 dist/* 命名规则）；server-linux
            # 通道未启用（gateway 未落地）时无 artifact，glob 空匹配不影响
            artifacts/web-app/*
            artifacts/server-linux/*
          draft: false
          generate_release_notes: true
