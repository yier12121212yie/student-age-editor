name: release

on:
  push:
    tags:
      - "v*"
      - "Alpha-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 发行版本号（如 Alpha-v0.1；留空则取 tag 名或 frontend/pubspec.yaml）
        required: false
        default: "Alpha-v0.1"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"
  PYTHON_VERSION: "3.12"
  # Windows runner 的管道 stdout 默认区域编码，中文打印会 UnicodeEncodeError
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 打包依赖
        # Windows 后端已切 native C++：pyinstaller+unitypy 仅供 aa_scan.exe
        # （资源扫描工具冻结）使用；构建失败脚本会降级为不随包，不阻塞。
        run: python -m pip install pyinstaller unitypy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 安装 Inno Setup 6 (Windows 安装包编译器)
        shell: bash
        run: |
          if ! command -v ISCC &> /dev/null && [ ! -f "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && [ ! -f "C:/Program Files/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y
          fi
          echo "C:\Program Files (x86)\Inno Setup 6" >> "$GITHUB_PATH"
          echo "C:\Program Files\Inno Setup 6" >> "$GITHUB_PATH"
      - name: 解析版本号
        shell: bash
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/Alpha-v* ]]; then VER="$GITHUB_REF_NAME"; fi
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?)(\+[0-9]+)?[[:space:]]*$/\1/p' frontend/pubspec.yaml | head -n1)"
          fi
          if [ -z "$VER" ]; then
            echo "错误：无法解析版本号（workflow_dispatch 输入、tag 名、pubspec.yaml 均未提供）" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 还原官方资源包缓存（ci-assets Release）
        shell: bash
        run: |
          python packaging/fetch_bundled.py --asset official_pack_cache.zip --tag ci-assets \
            --out build/cache/official_pack_cache.zip || true
          if [ -f build/cache/official_pack_cache.zip ]; then
            python -c "import zipfile; zipfile.ZipFile('build/cache/official_pack_cache.zip').extractall('backend/_cache')"
            echo "已加载官方资源包缓存"
          else
            echo "提示：未找到官方资源包缓存（ci-assets 缺少 official_pack_cache.zip），安装包将不包含内嵌资源"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 native C++ 后端（CMake，VS 生成器免 vcvars）
        shell: bash
        run: |
          # windows-latest 镜像自带 VS + cmake（2026-09 起为 windows-2025-vs2026，
          # 生成器名随大版本变化）；依次探测 VS 生成器，无需 Ninja/vcvars。
          cmake --version
          GEN_OK=""
          for GEN in "Visual Studio 18 2026" "Visual Studio 17 2022"; do
            rm -rf build-native
            if cmake -G "$GEN" -A x64 -T host=x64 -S native -B build-native; then
              GEN_OK="$GEN"; break
            fi
          done
          [ -n "$GEN_OK" ] || { echo "错误：未找到可用的 Visual Studio 生成器"; exit 1; }
          echo "使用生成器：$GEN_OK"
          cmake --build build-native --config Release
          mkdir -p build/native_bin
          for f in backend backend_cli backend_tui; do
            exe="$(find build-native -name "$f.exe" -type f | head -1)"
            [ -n "$exe" ] || { echo "错误：native 产物 $f.exe 未找到"; exit 1; }
            cp "$exe" build/native_bin/
          done
          ls -l build/native_bin
      - name: 构建 Windows 发行版与安装包
        shell: bash
        run: python build_release.py --target windows --version $RELEASE_VERSION --prebuilt-backend build/native_bin
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup-*.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build \
            pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 打包依赖
        # Linux 后端已是 native C++（W4-5）；pyinstaller/unitypy 仅供 aa_scan
        # 冻结（可选，失败脚本降级为不随包）；旧 CLI/TUI 的运行时依赖
        # （rich/textual/prompt_toolkit）已随 Python 后端退役。
        run: python -m pip install pyinstaller unitypy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 解析版本号
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/Alpha-v* ]]; then VER="$GITHUB_REF_NAME"; fi
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?)(\+[0-9]+)?[[:space:]]*$/\1/p' frontend/pubspec.yaml | head -n1)"
          fi
          if [ -z "$VER" ]; then
            echo "错误：无法解析版本号（workflow_dispatch 输入、tag 名、pubspec.yaml 均未提供）" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 下载 appimagetool（AppImage 打包工具）
        run: |
          mkdir -p build/tools
          curl -fL -o build/tools/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/tools/appimagetool-x86_64.AppImage
      - name: 还原官方资源包缓存（ci-assets Release）
        run: |
          python packaging/fetch_bundled.py --asset official_pack_cache.zip --tag ci-assets \
            --out build/cache/official_pack_cache.zip || true
          if [ -f build/cache/official_pack_cache.zip ]; then
            python -c "import zipfile; zipfile.ZipFile('build/cache/official_pack_cache.zip').extractall('backend/_cache')"
            echo "已加载官方资源包缓存"
          else
            echo "提示：未找到官方资源包缓存（ci-assets 缺少 official_pack_cache.zip），安装包将不包含内嵌资源"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 native C++ 后端（CMake + Ninja）
        shell: bash
        run: |
          # 本 job 已装 clang/cmake/ninja-build；与 native/build.sh 同法但显式
          # 构建三件套并收集到 build/native_bin 供 --prebuilt-backend 注入。
          cmake -G Ninja -S native -B build-native-posix -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native-posix
          mkdir -p build/native_bin
          cp build-native-posix/bin/backend build-native-posix/bin/backend_cli \
             build-native-posix/bin/backend_tui build/native_bin/
          ls -l build/native_bin
      - name: 构建 Linux 发行版与安装包（deb + AppImage）
        run: python build_release.py --target linux --version $RELEASE_VERSION --prebuilt-backend build/native_bin
      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.AppImage

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: 安装 Python 打包依赖
        # macOS 后端已是 native C++（W4-5）；pyinstaller/unitypy 仅供 aa_scan
        # 冻结（可选）；旧 CLI/TUI 的 rich/textual/prompt_toolkit 已退役。
        run: python3 -m pip install pyinstaller unitypy
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 解析版本号
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/Alpha-v* ]]; then VER="$GITHUB_REF_NAME"; fi
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?)(\+[0-9]+)?[[:space:]]*$/\1/p' frontend/pubspec.yaml | head -n1)"
          fi
          if [ -z "$VER" ]; then
            echo "错误：无法解析版本号（workflow_dispatch 输入、tag 名、pubspec.yaml 均未提供）" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 还原官方资源包缓存（ci-assets Release）
        run: |
          python3 packaging/fetch_bundled.py --asset official_pack_cache.zip --tag ci-assets \
            --out build/cache/official_pack_cache.zip || true
          if [ -f build/cache/official_pack_cache.zip ]; then
            python3 -c "import zipfile; zipfile.ZipFile('build/cache/official_pack_cache.zip').extractall('backend/_cache')"
            echo "已加载官方资源包缓存"
          else
            echo "提示：未找到官方资源包缓存（ci-assets 缺少 official_pack_cache.zip），安装包将不包含内嵌资源"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 native C++ 后端（CMake + Ninja）
        shell: bash
        run: |
          # macos-14 runner 自带 cmake；ninja 缺失时回落 CMake 默认生成器
          # （build_release.py 的 POSIX 通道同样容忍），三件套收进
          # build/native_bin 供 --prebuilt-backend 注入。
          if ! command -v ninja >/dev/null; then brew install ninja || true; fi
          GEN=""; command -v ninja >/dev/null && GEN="-G Ninja"
          cmake $GEN -S native -B build-native-posix -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native-posix
          mkdir -p build/native_bin
          cp build-native-posix/bin/backend build-native-posix/bin/backend_cli \
             build-native-posix/bin/backend_tui build/native_bin/
          ls -l build/native_bin
      - name: 构建 macOS 发行版与安装包（DMG + PKG）
        run: python3 build_release.py --target macos --version $RELEASE_VERSION --prebuilt-backend build/native_bin
      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.pkg

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # W4-4: Android 后端已是 native C++（libbackend_shared.so），不再内嵌 CPython。
      # setup-python 仅保留给 fetch_bundled.py（纯标准库 urllib，无需 pip 依赖）。
      - uses: android-actions/setup-android@v3
      - name: 安装 Android NDK（native 后端交叉编译）
        run: sdkmanager "ndk;28.2.13676358"
      - name: 确保 cmake/ninja 可用
        shell: bash
        run: |
          if ! command -v cmake >/dev/null; then sudo apt-get update && sudo apt-get install -y cmake; fi
          if ! command -v ninja >/dev/null; then sudo apt-get update && sudo apt-get install -y ninja-build; fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 解析版本号
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/Alpha-v* ]]; then VER="$GITHUB_REF_NAME"; fi
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VER" ]; then
            VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?)(\+[0-9]+)?[[:space:]]*$/\1/p' frontend/pubspec.yaml | head -n1)"
          fi
          if [ -z "$VER" ]; then
            echo "错误：无法解析版本号（workflow_dispatch 输入、tag 名、pubspec.yaml 均未提供）" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
      - name: 交叉编译 native 后端（NDK，产物落 jniLibs/<abi>/）
        shell: bash
        run: bash native/android/android_build.sh
      - name: 注入内置资源包（可选，从 GitHub Release 下载）
        shell: bash
        run: |
          python packaging/fetch_bundled.py \
            --asset bundled_preview.zip \
            --tag ci-assets \
            --out frontend/android/app/src/main/assets/bundled/resource_pack.zip \
          || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 Android APK
        working-directory: frontend
        run: flutter build apk --release --target-platform android-arm64,android-x64
      - name: 整理 APK 命名
        run: |
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk \
             "dist/student-age-editor-$RELEASE_VERSION-android.apk"
      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    name: 发布到 GitHub Release
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总产物
        run: find artifacts -type f | sort
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "学生时代模组编辑器 ${{ github.ref_name }}"
          files: |
            artifacts/windows/*
            artifacts/linux/*
            artifacts/macos/*
            artifacts/android/*
          draft: false
          generate_release_notes: true
