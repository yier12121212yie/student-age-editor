name: bug-hunt-test

# 专门用于排查 macOS 和 Android 平台问题的自动化诊断工作流
# 支持定时执行、手动触发和 PR 自动检测
# 
# 功能特点:
# 1. 自动捕获构建错误并生成详细诊断报告
# 2. 分阶段验证各组件 (Flutter/NDK/CocoaPods/Xcode)
# 3. 智能错误分类和建议修复方案
# 4. 上传完整日志供人工分析

on:
  # 定时执行：每天凌晨 3 点 UTC (北京时间 11 点)
  schedule:
    - cron: '0 3 * * *'
  
  # 前端代码变更时自动触发
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/bug-hunt.yml"
  
  # Pull Request 自动检测
  pull_request:
    paths:
      - "frontend/**"
  
  # 手动触发
  workflow_dispatch:
    inputs:
      platform:
        description: '选择目标平台'
        required: true
        type: choice
        options:
          - macos
          - android
          - both
        default: "both"
      verbose:
        description: '启用详细日志模式'
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read
  issues: write

env:
  FLUTTER_VERSION: "3.47.0"
  NDK_VERSION: "28.2.13676358"

jobs:
  # ============================================================
  # macOS Bug Hunt Job
  # ============================================================
  macos-diagnosis:
    name: 🍎 macOS Diagnosis
    if: ${{ github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'both' || (!github.event.inputs.platform && true) }}
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      success: ${{ steps.native_build.outcome == 'success' && steps.xcode_build.outcome == 'success' }}
      error_count: ${{ steps.analyze.outputs.error_count }}
      error_types: ${{ steps.analyze.outputs.error_types }}
    
    steps:
      - name: 🚩 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📊 System Environment Information
        id: env_info
        run: |
          echo "macOS=$(sw_vers | grep 'Product Version' | awk '{print $3}')" >> $GITHUB_OUTPUT
          echo "xcodeVersion=$(xcodebuild -version 2>&1 | head -1)" >> $GITHUB_OUTPUT
          echo "swiftVersion=$(swift --version 2>&1 | head -1)" >> $GITHUB_OUTPUT
          echo "gitVersion=$(git --version)" >> $GITHUB_OUTPUT
          echo "cmakeVersion=$(cmake --version 2>&1 | head -1)" >> $GITHUB_OUTPUT
          if command -v ninja &> /dev/null; then
            echo "ninjaInstalled=true" >> $GITHUB_OUTPUT
            echo "ninjaVersion=$(ninja --version)" >> $GITHUB_OUTPUT
          else
            echo "ninjaInstalled=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 🔧 Install Dependencies (Homebrew)
        run: |
          brew update || echo "⚠️ Brew update failed, continuing..."
          brew install cmake ninja || echo "⚠️ Package installation had warnings"
      
      - name: 🔨 Native C++ Backend Build Test
        id: native_build
        run: |
          mkdir -p build-native-macos-debug && cd build-native-macos-debug
          
          echo "Configuring with Ninja generator..."
          if ! cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -S ../native -B . 2>&1 | tee cmake_configure.log; then
            echo "❌ CMake configuration failed" >> $GITHUB_STEP_SUMMARY
            cat cmake_configure.log >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Building native backend..."
          if ! cmake --build . --target all 2>&1 | tee cmake_build.log; then
            echo "❌ Native build failed" >> $GITHUB_STEP_SUMMARY
            cat cmake_build.log >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Running tests..."
          ctest --output-on-failure || echo "⚠️ Some tests may have failed"
          
          echo "success=true" >> $GITHUB_OUTPUT
        continue-on-error: false
      
      - name: 🏗️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      
      - name: 📱 Flutter Doctor
        id: flutter_doctor
        run: |
          flutter doctor -v 2>&1 | tee flutter_doctor.log || true
      
      - name: 🍏 CocoaPods Installation
        id: pod_install
        working-directory: frontend/macos
        run: |
          if [ ! -f "Podfile" ]; then
            echo "⚠️ Podfile not found, skipping CocoaPods"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Installing CocoaPods dependencies..."
          if ! pod install 2>&1 | tee pod_install.log; then
            echo "⚠️ Pods installation failed or has warnings" >> $GITHUB_STEP_SUMMARY
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "✅ CocoaPods installed successfully" >> $GITHUB_STEP_SUMMARY
            echo "status=succeeded" >> $GITHUB_OUTPUT
          fi
      
      - name: 🛠️ Xcode Build Attempt
        id: xcode_build
        working-directory: frontend/macos
        continue-on-error: true
        run: |
          if [ ! -f "Runner.xcworkspace" ]; then
            echo "❌ Runner.xcworkspace not found"
            exit 1
          fi
          
          echo "Starting Xcode build..."
          if xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk macosx \
            -destination 'platform=macOS' \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcode_full_build.log; then
            echo "✅ Xcode build succeeded"
            echo "status=succeeded" >> $GITHUB_OUTPUT
          else
            echo "❌ Xcode build failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            
            # Extract key errors for analysis
            grep -i "error:" xcode_full_build.log > xcode_errors.tmp || true
            head -50 xcode_errors.tmp >> xcode_full_build.log
          fi
      
      - name: 🔐 Codesign Certificate Check
        if: always()
        run: |
          echo "=== Available Codesign Identities ==="
          security find-identity -v -p codesigning 2>&1 || echo "Could not list identities"
          echo ""
          echo "=== Keychain Status ==="
          security list-keychains -d user 2>&1 || echo "Keychain query failed"
      
      - name: 🤖 Error Analysis & Report Generation
        id: analyze
        run: |
          echo "# 🍎 macOS Bug Hunt Report" > macos_bug_report.md
          echo "" >> macos_bug_report.md
          echo "**Generated**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> macos_bug_report.md
          echo "**Commit**: ${{ github.sha }}" >> macos_bug_report.md
          echo "**Branch**: ${{ github.ref }}" >> macos_bug_report.md
          echo "" >> macos_bug_report.md
          
          echo "## Environment Summary" >> macos_bug_report.md
          echo "- Runner: macos-14" >> macos_bug_report.md
          echo "- Xcode: $(xcodebuild -version | head -1)" >> macos_bug_report.md
          echo "" >> macos_bug_report.md
          
          echo "## Build Results" >> macos_bug_report.md
          echo "- Native C++: ${{ steps.native_build.outcome }}" >> macos_bug_report.md
          echo "- Flutter Doctor: ${{ steps.flutter_doctor.outcome }}" >> macos_bug_report.md
          echo "- CocoaPods: ${{ steps.pod_install.outputs.status }}" >> macos_bug_report.md
          echo "- Xcode Build: ${{ steps.xcode_build.outputs.status }}" >> macos_bug_report.md
          echo "" >> macos_bug_report.md
          
          # Extract and summarize errors
          if [ -f "xcode_full_build.log" ]; then
            echo "### 🔴 Xcode Errors" >> macos_bug_report.md
            echo "" >> macos_bug_report.md
            ERRORS_FOUND=$(grep -ci "error:" xcode_full_build.log 2>/dev/null || echo "0")
            if [ "$ERRORS_FOUND" -gt 0 ]; then
              grep -i "error:" xcode_full_build.log 2>/dev/null | head -20 >> macos_bug_report.md
            else
              echo "No critical errors found ✅" >> macos_bug_report.md
            fi
            echo "" >> macos_bug_report.md
          fi
          
          if [ -f "pod_install.log" ] && grep -qi "error\|warning" pod_install.log; then
            echo "### ⚠️ CocoaPods Warnings/Errors" >> macos_bug_report.md
            echo "" >> macos_bug_report.md
            grep -iE "(error|warning|deprecated)" pod_install.log | head -10 >> macos_bug_report.md
            echo "" >> macos_bug_report.md
          fi
          
          # Generate actionable recommendations
          echo "## 💡 Recommended Actions" >> macos_bug_report.md
          echo "" >> macos_bug_report.md
          
          if [ "${{ steps.xcode_build.outputs.status }}" = "failed" ]; then
            echo "1. **Check Xcode Project Configuration**" >> macos_bug_report.md
            echo "   ```bash" >> macos_bug_report.md
            echo "   cd frontend/macos" >> macos_bug_report.md
            echo "   pod install" >> macos_bug_report.md
            echo "   xcodebuild -workspace Runner.xcworkspace -list" >> macos_bug_report.md
            echo "   ```" >> macos_bug_report.md
            echo "" >> macos_bug_report.md
          fi
          
          if [ "${{ steps.pod_install.outputs.status }}" != "succeeded" ]; then
            echo "2. **Update CocoaPods**" >> macos_bug_report.md
            echo "   ```bash" >> macos_bug_report.md
            echo "   sudo gem install cocoapods" >> macos_bug_report.md
            echo "   pod repo update" >> macos_bug_report.md
            echo "   ```" >> macos_bug_report.md
            echo "" >> macos_bug_report.md
          fi
          
          echo "3. **Clean Flutter Build Artifacts**" >> macos_bug_report.md
          echo "   ```bash" >> macos_bug_report.md
          echo "   cd frontend" >> macos_bug_report.md
          echo "   flutter clean" >> macos_bug_report.md
          echo "   flutter pub get" >> macos_bug_report.md
          echo "   ```" >> macos_bug_report.md
          echo "" >> macos_bug_report.md
          
          echo "4. **Verify macOS Deployment Target**" >> macos_bug_report.md
          echo "   Check `frontend/macos/Runner/Info.plist` for minimum version requirements" >> macos_bug_report.md
          echo "" >> macos_bug_report.md
          
          # Count errors
          ERROR_COUNT=$(grep -ci "error:" xcode_full_build.log 2>/dev/null || echo "0")
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          
          # Categorize errors
          echo "error_types=" >> $GITHUB_OUTPUT
          if grep -qi "undefined.*symbol" xcode_full_build.log 2>/dev/null; then
            echo "linking_issues" >> $GITHUB_OUTPUT
          fi
          if grep -qi "module.*not found" xcode_full_build.log 2>/dev/null; then
            echo "$error_types,cocoapods_missing" >> $GITHUB_OUTPUT
          fi
          if grep -qi "deployment.target" xcode_full_build.log 2>/dev/null; then
            echo "$error_types,deployment_version" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Full Logs (macOS)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-logs
          path: |
            build-native-macos-debug/cmake_configure.log
            build-native-macos-debug/cmake_build.log
            frontend/macos/xcode_full_build.log
            frontend/macos/pod_install.log
            flutter_doctor.log
            macos_bug_report.md
          retention-days: 7
  
  # ============================================================
  # Android Bug Hunt Job
  # ============================================================
  android-diagnosis:
    name: 🤖 Android Diagnosis
    if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || (!github.event.inputs.platform && true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      success: ${{ steps.native_android_build.outcome == 'success' && steps.apk_build.outcome == 'success' }}
      error_count: ${{ steps.analyze.outputs.error_count }}
      error_types: ${{ steps.analyze.outputs.error_types }}
    
    steps:
      - name: 🚩 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📊 System Environment Information
        id: env_info
        run: |
          echo "javaVersion=$(java -version 2>&1 | head -1)" >> $GITHUB_OUTPUT
          echo "gradleVersion=$(cat frontend/android/gradle/wrapper/gradle-wrapper.properties | grep 'distributionUrl' | awk -F'[=:]' '{print $3}' | head -1)" >> $GITHUB_OUTPUT
          echo "ndkVersion=$NDK_VERSION" >> $GITHUB_OUTPUT
      
      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest
          accept-license: true
      
      - name: 📦 Install NDK & Build Tools
        run: |
          sdkmanager --list | grep -A5 "ndk;"
          sdkmanager "ndk;$NDK_VERSION" "build-tools;34.0.0" "platform-tools" || echo "⚠️ Some packages may have already been installed"
      
      - name: ✅ Verify NDK Installation
        run: |
          echo "=== Installed NDK Versions ==="
          sdkmanager --installed | grep ndk
          echo ""
          echo "=== Expected NDK Path ==="
          ls -la $ANDROID_HOME/ndk/$NDK_VERSION/ 2>/dev/null || echo "NDK not found at expected path"
      
      - name: 🔨 Native Backend Android Build Test
        id: native_android_build
        run: |
          if [ ! -f "native/android/android_build.sh" ]; then
            echo "⚠️ Android build script not found"
            echo "status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "=== Starting Native Backend Build ==="
          if bash native/android/android_build.sh 2>&1 | tee ndk_build.log; then
            echo "✅ Native backend built successfully"
            echo "Status: Success" >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "=== ABI Filters Verification ==="
            ls -la native/jniLibs/ 2>/dev/null || echo "jniLibs directory empty or missing"
            
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Native backend build FAILED" >> $GITHUB_STEP_SUMMARY
            tail -50 ndk_build.log >> $GITHUB_STEP_SUMMARY
            echo "Status: Failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: false
      
      - name: 🏗️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      
      - name: 📱 Flutter Doctor
        id: flutter_doctor
        run: |
          flutter doctor -v 2>&1 | tee flutter_doctor.log || true
      
      - name: 🧹 Clean Flutter Project
        working-directory: frontend
        run: |
          flutter clean
          flutter pub get
      
      - name: 🔍 Gradle Dependency Analysis
        working-directory: frontend/android
        continue-on-error: true
        run: |
          echo "=== Checking Gradle Dependencies ==="
          ./gradlew dependencies --configuration debugCompileClasspath 2>&1 | head -100 > gradle_deps.tmp || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Top-level dependencies:" >> $GITHUB_STEP_SUMMARY
          cat gradle_deps.tmp >> $GITHUB_STEP_SUMMARY
      
      - name: 🛠️ Build APK (Detailed Output)
        id: apk_build
        working-directory: frontend
        continue-on-error: true
        run: |
          echo "=== Starting Flutter APK Build ==="
          echo "Target platforms: android-arm64,android-x64"
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if flutter build apk --release --target-platform android-arm64,android-x64 \
            --dart-define=flutter.build.mode=release \
            2>&1 | tee flutter_apk_build.log; then
            echo "✅ APK build succeeded"
            echo "status=succeeded" >> $GITHUB_OUTPUT
          else
            echo "❌ APK build FAILED"
            echo "status=failed" >> $GITHUB_OUTPUT
            
            # Log key error sections
            echo "" >> flutter_apk_build.log
            echo "=== KEY ERROR SECTIONS ===" >> flutter_apk_build.log
            grep -i "fatal\|error:\|cannot" flutter_apk_build.log >> flutter_apk_build.log 2>/dev/null || true
          fi
      
      - name: ✅ Verify APK Artifact
        id: apk_verify
        run: |
          APK_PATH="frontend/build/app/outputs/flutter-apk/app-release.apk"
          
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK created successfully!"
            echo "Size: $(ls -lh $APK_PATH | awk '{print $5}')"
            echo ""
            
            echo "=== APK Contents (SO files) ==="
            unzip -l "$APK_PATH" | grep "\.so$" || echo "No native libraries found"
            
            echo "apk_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ APK not found at expected location"
            echo "Looking in frontend/build/app/outputs/flutter-apk/..."
            ls -lah frontend/build/app/outputs/flutter-apk/ 2>/dev/null || echo "Directory doesn't exist"
            echo "apk_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 🤖 Intelligent Error Analysis
        id: analyze
        run: |
          echo "# 🤖 Android Bug Hunt Report" > android_bug_report.md
          echo "" >> android_bug_report.md
          echo "**Generated**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> android_bug_report.md
          echo "**Commit**: ${{ github.sha }}" >> android_bug_report.md
          echo "**Branch**: ${{ github.ref }}" >> android_bug_report.md
          echo "" >> android_bug_report.md
          
          echo "## Environment Summary" >> android_bug_report.md
          echo "- Runner: ubuntu-latest" >> android_bug_report.md
          echo "- Android SDK: $ANDROID_HOME" >> android_bug_report.md
          echo "- NDK Version: $NDK_VERSION" >> android_bug_report.md
          echo "- Gradle: 9.3.1" >> android_bug_report.md
          echo "" >> android_bug_report.md
          
          echo "## Build Results" >> android_bug_report.md
          echo "- Native Backend (Android): ${{ steps.native_android_build.outcome }}" >> android_bug_report.md
          echo "- Flutter Doctor: ${{ steps.flutter_doctor.outcome }}" >> android_bug_report.md
          echo "- APK Build: ${{ steps.apk_build.outcome }}" >> android_bug_report.md
          echo "- APK Exists: ${{ steps.apk_verify.outputs.apk_exists }}" >> android_bug_report.md
          echo "" >> android_bug_report.md
          
          # Analyze errors using pattern matching
          if [ -f "flutter_apk_build.log" ]; then
            echo "### 🔴 Build Errors" >> android_bug_report.md
            echo "" >> android_bug_report.md
            
            DART_ERRORS=$(grep -c "Error:" flutter_apk_build.log 2>/dev/null || echo "0")
            if [ "$DART_ERRORS" -gt 0 ]; then
              echo "#### Dart Compilation Errors ($DART_ERRORS found)" >> android_bug_report.md
              grep "Error:" flutter_apk_build.log 2>/dev/null | head -10 >> android_bug_report.md
              echo "" >> android_bug_report.md
            fi
            
            GRADLE_CONFLICTS=$(grep -cE "(conflict|override|duplicate)" flutter_apk_build.log 2>/dev/null || echo "0")
            if [ "$GRADLE_CONFLICTS" -gt 0 ]; then
              echo "#### Gradle Dependency Conflicts ($GRADLE_CONFLICTS found)" >> android_bug_report.md
              grep -iE "(conflict|override|duplicate)" flutter_apk_build.log 2>/dev/null | head -5 >> android_bug_report.md
              echo "" >> android_bug_report.md
            fi
            
            NDK_ERRORS=$(grep -cE "(no rule|unresolved|cannot find).*\.(so|a)" flutter_apk_build.log 2>/dev/null || echo "0")
            if [ "$NDK_ERRORS" -gt 0 ]; then
              echo "#### NDK Linking Issues ($NDK_ERRORS found)" >> android_bug_report.md
              grep -iE "(no rule|unresolved|cannot find).*\.(so|a)" flutter_apk_build.log 2>/dev/null | head -10 >> android_bug_report.md
              echo "" >> android_bug_report.md
            fi
            
            SIGNING_ERRORS=$(grep -cE "(keystore|signature|certificate)" flutter_apk_build.log 2>/dev/null || echo "0")
            if [ "$SIGNING_ERRORS" -gt 0 ]; then
              echo "#### Signature/Keystore Issues ($SIGNING_ERRORS found)" >> android_bug_report.md
              grep -iE "(keystore|signature|certificate)" flutter_apk_build.log 2>/dev/null | head -5 >> android_bug_report.md
              echo "" >> android_bug_report.md
            fi
          fi
          
          # Generate recommendations
          echo "## 💡 Recommended Actions" >> android_bug_report.md
          echo "" >> android_bug_report.md
          
          RECOMMENDATIONS=""
          
          if [ "${{ steps.apk_build.outcome }}" = "failure" ]; then
            if [ "${{ steps.apk_verify.outputs.apk_exists }}" = "false" ]; then
              RECOMMENDATIONS+="1. **Clean Flutter Build Completely**\n"
              RECOMMENDATIONS+="   ```bash\n"
              RECOMMENDATIONS+="   cd frontend\n"
              RECOMMENDATIONS+="   flutter clean\n"
              RECOMMENDATIONS+="   rm -rf .dart_tool build/\n"
              RECOMMENDATIONS+="   flutter pub get\n"
              RECOMMENDATIONS+="   ```\n\n"
            fi
            
            if [ "$NDK_ERRORS" -gt 0 ]; then
              RECOMMENDATIONS+="2. **Verify Native Backend JNI Library**\n"
              RECOMMENDATIONS+="   Check if `libbackend_shared.so` exists in `native/jniLibs/arm64-v8a/`\n"
              RECOMMENDATIONS+="   Rebuild native backend: `bash native/android/android_build.sh`\n\n"
            fi
            
            if [ "$GRADLE_CONFLICTS" -gt 0 ]; then
              RECOMMENDATIONS+="3. **Resolve Gradle Dependency Conflicts**\n"
              RECOMMENDATIONS+="   ```bash\n"
              RECOMMENDATIONS+="   cd frontend/android\n"
              RECOMMENDATIONS+="   ./gradlew app:dependencies --configuration debugCompileClasspath\n"
              RECOMMENDATIONS+="   ```\n\n"
            fi
          fi
          
          if [ "${{ steps.native_android_build.outcome }}" = "failure" ]; then
            RECOMMENDATIONS+="4. **Fix Native Backend Build**\n"
            RECOMMENDATIONS+="   Review errors in `native/android/android_build.sh` output\n"
            RECOMMENDATIONS+="   Check NDK version compatibility with current project\n"
            RECOMMENDATIONS+="   Ensure CMakeLists.txt includes correct ABI filters\n\n"
          fi
          
          RECOMMENDATIONS+="5. **General Troubleshooting**\n"
          RECOMMENDATIONS+="   - Verify Android SDK API levels match `compileSdk` in `build.gradle.kts`\n"
          RECOMMENDATIONS+="   - Check keystore configuration in `app/build.gradle.kts`\n"
          RECOMMENDATIONS+="   - Update Gradle wrapper if needed (`gradle-wrapper.properties`)\n"
          
          echo -e "$RECOMMENDATIONS" >> android_bug_report.md
          
          # Count total errors
          ERROR_COUNT=$(cat flutter_apk_build.log 2>/dev/null | grep -ci "error\|fatal" || echo "0")
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          
          # Categorize error types
          echo "error_types=" >> $GITHUB_OUTPUT
          if [ "$DART_ERRORS" -gt 0 ]; then
            echo "dart_compile" >> $GITHUB_OUTPUT
          fi
          if [ "$GRADLE_CONFLICTS" -gt 0 ]; then
            echo "$error_types,gradle_conflict" >> $GITHUB_OUTPUT
          fi
          if [ "$NDK_ERRORS" -gt 0 ]; then
            echo "$error_types,ndk_linking" >> $GITHUB_OUTPUT
          fi
          if [ "$SIGNING_ERRORS" -gt 0 ]; then
            echo "$error_types,signing_issue" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Full Logs (Android)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-logs
          path: |
            ndk_build.log
            flutter_apk_build.log
            gradle_deps.tmp
            flutter_doctor.log
            android_bug_report.md
            frontend/.gradle/
          retention-days: 7
  
  # ============================================================
  # Summary Job
  # ============================================================
  report-summary:
    name: 📋 Summary Report
    needs: [macos-diagnosis, android-diagnosis]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download All Logs
        uses: actions/download-artifact@v4
      
      - name: Generate Summary
        run: |
          echo "# CI/CD Bug Hunt Summary" > summary_report.md
          echo "" >> summary_report.md
          echo "**Date**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> summary_report.md
          echo "**GitHub Action**: ${{ github.workflow }}" >> summary_report.md
          echo "" >> summary_report.md
          
          echo "## Job Status" >> summary_report.md
          echo "" >> summary_report.md
          echo "- macOS Diagnosis: ${{ needs.macos-diagnosis.result }}" >> summary_report.md
          if [ "${{ needs.android-diagnosis.result }}" != "" ]; then
            echo "- Android Diagnosis: ${{ needs.android-diagnosis.result }}" >> summary_report.md
          fi
          echo "" >> summary_report.md
          
          MACOS_ERRORS="${{ needs.macos-diagnosis.outputs.error_count }}"
          ANDROID_ERRORS="${{ needs.android-diagnosis.outputs.error_count }}"
          
          echo "## Error Summary" >> summary_report.md
          echo "" >> summary_report.md
          echo "- macOS Errors: ${MACOS_ERRORS:-0}" >> summary_report.md
          echo "- Android Errors: ${ANDROID_ERRORS:-0}" >> summary_report.md
          echo "" >> summary_report.md
          
          if [ -d "macos-build-logs" ]; then
            echo "## Detailed Reports" >> summary_report.md
            echo "" >> summary_report.md
            echo "### macOS Bug Report" >> summary_report.md
            cat "macos-build-logs/macos_bug_report.md" >> summary_report.md
            echo "" >> summary_report.md
          fi
          
          if [ -d "android-build-logs" ]; then
            echo "### Android Bug Report" >> summary_report.md
            cat "android-build-logs/android_bug_report.md" >> summary_report.md
          fi
          
          echo "---" >> summary_report.md
          echo "*Report generated automatically by GitHub Actions*" >> summary_report.md
          cat summary_report.md
      
      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: ci-bug-hunt-summary
          path: summary_report.md
          retention-days: 14
