name: secret-scan

# 轻量密钥扫描（防再犯）：自动触发只扫本次改动的新增行，
# 命中 sk-/AKIA/ghp_ 等已知前缀即失败；手动 workflow_dispatch
# 全树扫描，输出存量泄漏清单（数据根迁出与轮换属线下操作，本工作流
# 只负责阻止新提交继续携带密钥）。正则字面量不会自匹配（后随字符
# 落在字符类外），全树扫描仍排除本文件自身以防改写后自触发。

on:
  push:
    branches: [main, cpp-backend]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: 扫描新增/全树密钥模式
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描
        run: |
          # 词边界前缀（安全批次 A 放宽）："(^|[^A-Za-z0-9])" 防止 "task-…"
          # 这类普通标识符里的 "sk-…" 子串触发假阳性；AKIA 同理防 base64 样串。
          PATTERN='(^|[^A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}|(^|[^A-Za-z0-9])AKIA[0-9A-Z]{16}|(^|[^A-Za-z0-9])gh[pousr]_[A-Za-z0-9]{36}|(^|[^A-Za-z0-9])github_pat_[A-Za-z0-9_]{30,}|(^|[^A-Za-z0-9])xox[baprs]-[A-Za-z0-9-]{10,}'
          # 占位符豁免：测试/文档里惯用的 fake key（sk-test…/sk-xxx…/…placeholder）
          # 不是密钥，先摘除再扫，避免示例代码反复打断 CI。
          PLACEHOLDER='(^|[^A-Za-z0-9])sk-(test|xxx|demo|sample|example|placeholder|your)[-A-Za-z0-9_]{0,}'
          EXCL=':(exclude).github/workflows/secret-scan.yml'
          # 参考资料/ 是第三方网页/压缩 JS 存档：vendors.*.js 内的 base64 样串
          # 会命中 AKIA 形态假阳性（AKIAAA…），该目录不存放本项目凭据——
          # 手动全树扫描分支整体排除；增量分支（push/PR diff）不受影响。
          # 注意：两个 pathspec 均不含空格，第 5 步展开时刻意不加引号以按词拆分。
          EXCL="$EXCL :(exclude)参考资料"
          status=0
          report() {
            # $1 = 命中清单（file:line 或 file:line:content）。只播报定位信息，
            # 绝不回显命中行本身，避免扫描器把密钥抄进 CI 日志。
            if [ -n "$1" ]; then
              LOC=$(echo "$1" | head -n 40 | awk -F: '{print $1":"$2" 命中密钥模式"}')
              echo "$LOC"
              echo "$LOC" | while IFS= read -r hit; do
                echo "::error title=疑似密钥泄漏::${hit}"
              done
              status=1
            fi
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "全树扫描（HEAD=${{ github.sha }}）"
            report "$(git grep -I -n -E "$PATTERN" -- $EXCL || true | grep -E -iv "$PLACEHOLDER" || true)"
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            else
              BASE="${{ github.event.before }}"
              HEAD_SHA="${{ github.sha }}"
            fi
            # 新分支首次 push（before 全零 / 对象缺失）：本次不比对，
            # 需要全树审计时用 workflow_dispatch。
            if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              echo "基线 ${BASE} 不可达，跳过增量扫描"
              exit 0
            fi
            echo "增量扫描 ${BASE:0:8}..${HEAD_SHA:0:8}（仅新增行）"
            # 跟踪新文件行号，输出 file:line:content 供 report 只播报定位。
            ADDED=$(git diff -U0 "$BASE" "$HEAD_SHA" | \
              awk -v skip='.github/workflows/secret-scan.yml' '
                /^@@ /{ if (match($0, /\+[0-9]+/)) ln = substr($0, RSTART+1, RLENGTH-1) + 0 }
                /^\+\+\+ b\//{ f = substr($2, 3) }
                /^\+/ && !/^\+\+\+/ { if (f != skip) print f ":" ln ":" substr($0, 2); ln++ }
                /^ / { ln++ }')
            report "$(echo "$ADDED" | grep -E -iv "$PLACEHOLDER" | grep -E -i "$PATTERN" || true)"
          fi
          exit $status
